name: Build documentation
description: >
    Resolve the engine commit to document, generate the C++ API model with Doxygen and build the site into dist/.
    Expects the docs repository to be checked out and the Setup action to have run.

inputs:
    version:
        description: Version to build as (defaults to `version` in docs.config.ts).
        default: ""
    path:
        description: URL segment to publish under, e.g. `stable` (defaults to the version).
        default: ""
    doxygen-version:
        description: Doxygen release to install.
        default: 1.18.0

outputs:
    engine-ref:
        description: Engine commit or tag the documentation was built from.
        value: ${{ steps.engine.outputs.ref }}

runs:
    using: composite
    steps:
        - id: engine
          name: Resolve engine ref
          shell: bash
          run: pnpm tsx scripts/ci/engine-ref.ts
          env:
              GITHUB_TOKEN: ${{ github.token }}
              DOCS_VERSION: ${{ inputs.version }}

        - uses: actions/checkout@v4
          with:
              repository: ${{ steps.engine.outputs.repository }}
              ref: ${{ steps.engine.outputs.ref }}
              path: engine

        - uses: ./.github/actions/doxygen
          with:
              version: ${{ inputs.doxygen-version }}

        - name: Generate API model
          shell: bash
          run: pnpm api
          env:
              ATMO_ENGINE_DIR: engine
              ATMO_ENGINE_REF: ${{ steps.engine.outputs.name }}

        - name: Build site
          shell: bash
          run: pnpm build
          env:
              ATMO_ENGINE_DIR: engine
              ATMO_ENGINE_REF: ${{ steps.engine.outputs.name }}
              DOCS_VERSION: ${{ inputs.version }}
              DOCS_PATH: ${{ inputs.path }}
