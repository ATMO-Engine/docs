name: Install Doxygen
description: Install a Doxygen release and add it to the PATH.

inputs:
    version:
        description: Doxygen release to install.
        default: 1.18.0

runs:
    using: composite
    steps:
        - id: cache
          uses: actions/cache@v4
          with:
              path: ${{ runner.temp }}/doxygen-${{ inputs.version }}
              key: doxygen-${{ runner.os }}-${{ inputs.version }}

        - if: steps.cache.outputs.cache-hit != 'true'
          shell: bash
          env:
              DOXYGEN_VERSION: ${{ inputs.version }}
          run: |
              curl -fsSL "https://github.com/doxygen/doxygen/releases/download/Release_${DOXYGEN_VERSION//./_}/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz" \
                  | tar -xz -C "$RUNNER_TEMP"

        - shell: bash
          run: echo "$RUNNER_TEMP/doxygen-${{ inputs.version }}/bin" >> "$GITHUB_PATH"
